<!-- 01 · Title -->
<section class="slide no-chrome title-slide">
  <style>
    .title-slide { padding: 0; flex-direction: row; }
    .title-slide .tl { flex: 1; padding: 150px 0 110px 130px; display: flex; flex-direction: column; }
    .title-slide h1 { font-family: var(--mono); font-weight: 500; font-size: 80px; letter-spacing: -0.03em; line-height: 1.08; margin: 26px 0 30px; }
    .title-slide .sub { font-size: 40px; line-height: 1.3; max-width: 1000px; }
    .title-slide .who { margin-top: auto; font-size: 34px; }
    .title-slide .logos { display: flex; gap: 56px; align-items: center; margin-top: 46px; }
    .title-slide .tr { width: 720px; background: var(--accent-bg); }
  </style>
  <div class="tl">
    <div class="kicker">Hands-on · EM-TCCM · Aspet, 27 Nov 2026</div>
    <h1>ML/MM free energy<br>of an S<sub style="font-size:.6em">N</sub>2 reaction</h1>
    <div class="sub">Cl⁻ + CH₃Cl in water with AIMNet2 + EMLE</div>
    <div class="who"><b>Kirill Zinovjev</b><br><span class="muted">Departament de Química Física, Universitat de València</span></div>
    <div class="logos"><img src="../lecture/media/uv-logo.png" alt="Universitat de València" style="height:96px"><img src="../lecture/media/ifflab.svg" alt="IFFLab" style="height:80px"></div>
  </div>
  <div class="tr">
    <svg viewBox="0 0 720 1080" width="720" height="1080">
      <defs><clipPath id="t-clip"><circle cx="360" cy="540" r="330"/></clipPath></defs>
      <circle cx="360" cy="540" r="330" fill="var(--bg)"/>
      <g clip-path="url(#t-clip)"><!--include figs/title.svg--></g>
      <circle cx="360" cy="540" r="330" fill="none" stroke="var(--accent)" stroke-width="3"/>
    </svg>
  </div>
</section>
