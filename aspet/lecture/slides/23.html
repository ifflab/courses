  <script>
    (() => {
      const s = document.getElementById('s23');
      const place = () => {
        const w = s.querySelector('.eqi'), a = s.querySelector('.eqa'), k = [...w.querySelectorAll('.katex-html > .base > .mord')].filter(n => n.textContent[0] === 'E')[1];
        if (!k) return setTimeout(place, 200);
        const e = k.firstElementChild.getBoundingClientRect(), r = w.getBoundingClientRect(), sc = r.width / w.offsetWidth;
        a.style.left = ((e.left - r.left) / sc + e.width / 2 - 20) + 'px';
        a.style.top = ((k.getBoundingClientRect().bottom - r.top) / sc + 2) + 'px';
        a.querySelector('.eml1').style.left = '-6px';
      };
      setTimeout(place, 300); window.addEventListener('load', place);
      const blob = s.querySelector('.ml-blob'), ghost = s.querySelector('.f0');
      const CX = 1370, CY = 330, M = 96;
      const base = th => { const c = Math.cos(th), si = Math.sin(th); return (1 / Math.hypot(c / 165, si / 112)) * (1 + .05 * Math.sin(3 * th + 1) + .03 * Math.cos(2 * th)); };
      let qs = null, d = null, t = 0, raf = 0;
      const field = () => {
        qs = [...s.querySelectorAll('.q')].map(g => { const m = /translate\(([-\d.]+) ([-\d.]+)\)/.exec(g.getAttribute('transform')); return [+m[1], +m[2], g.classList.contains('pos') ? 1 : -1]; });
        d = Array.from({ length: M }, (_, i) => {
          const th = 2 * Math.PI * i / M, r = base(th), bx = CX + r * Math.cos(th), by = CY + r * Math.sin(th), nx = Math.cos(th), ny = Math.sin(th);
          let f = 0; for (const [x, y, q] of qs) { const dx = x - bx, dy = y - by, l = Math.hypot(dx, dy); f += q * (dx * nx + dy * ny) / (l * l * l); }
          return f;
        });
        const mx = Math.max(...d.map(Math.abs)); d = d.map(v => .32 * v / mx);
        const sm = d.map((v, i) => (d[(i + M - 2) % M] + 2 * d[(i + M - 1) % M] + 3 * v + 2 * d[(i + 1) % M] + d[(i + 2) % M]) / 9); d = sm;
      };
      const path = k => 'M' + Array.from({ length: M }, (_, i) => { const th = 2 * Math.PI * i / M, r = base(th) * (1 + k * (d ? d[i] : 0)); return (CX + r * Math.cos(th)).toFixed(1) + ',' + (CY + r * Math.sin(th)).toFixed(1); }).join('L') + 'Z';
      const draw = () => { if (!d) field(); blob.setAttribute('d', path(t)); ghost.setAttribute('d', path(0)); ghost.setAttribute('opacity', Math.min(1, t * 2) * (false ? 1 : 0)); };
      s.addEventListener('step', e => {
        if (!d) field();
        const to = (false && e.detail.step >= 1) ? 1 : 0, from = t, t0 = performance.now();
        cancelAnimationFrame(raf);
        if (document.body.classList.contains('no-anim')) { t = to; draw(); return; }
        const tick = now => { const u = Math.min(1, (now - t0) / 900), v = u * u * (3 - 2 * u); t = from + (to - from) * v; draw(); if (u < 1) raf = requestAnimationFrame(tick); };
        raf = requestAnimationFrame(tick);
      });
    })();
</script>
